<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Money Manager V13</title>
<style>
body{font-family:Arial;margin:0;background:#eef3f8}
#login{display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);width:320px}
input{width:100%;padding:10px;margin:6px 0;box-sizing:border-box}
button{background:#123b72;color:white;border:none;padding:10px;border-radius:8px;cursor:pointer}
#app{display:none}
header{background:#123b72;color:white;padding:15px}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h2>🔒 Money Manager</h2>
    <input type="password" id="pwd" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="msg" style="color:red;margin-top:8px"></div>
    <p><small>Default password: Ali2025!</small></p>
  </div>
</div>

<div id="app">
<header>
<h1>💰 Money Manager V13</h1>
<button onclick="logout()">Logout</button>
</header>

<div style="padding:20px">
<div class="card">
<h3>Settings</h3>
<input type="password" id="newPwd" placeholder="New Password">
<button onclick="changePassword()">Change Password</button>
</div>

<div class="card">
<h3>Security Features Added</h3>
<ul>
<li>Password protection</li>
<li>Logout button</li>
<li>Change password</li>
<li>Local browser storage</li>
</ul>
</div>
</div>
</div>

<script>
if(!localStorage.getItem('mm_password')){
  localStorage.setItem('mm_password','Ali2025!');
}

function login(){
  const p=document.getElementById('pwd').value;
  if(p===localStorage.getItem('mm_password')){
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
  }else{
    document.getElementById('msg').innerText='Incorrect password';
  }
}

function logout(){
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
}

function changePassword(){
  const np=document.getElementById('newPwd').value;
  if(np.length<4){ alert('Password must be at least 4 characters'); return; }
  localStorage.setItem('mm_password',np);
  alert('Password changed');
}
</script>
</body>
</html>
